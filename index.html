<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recalibrate · 21 Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0e0a1a;
  --night-2:#171029;
  --plum-deep:#1c1430;
  --plum:#2e2348;
  --plum-glass:rgba(60,46,92,0.42);
  --lavender:#b9a8e0;
  --lavender-soft:#d7cdee;
  --lavender-bright:#c9b8ec;
  --gold:#e8c87a;
  --text:#e9e3f6;
  --text-soft:#b3a8cc;
  --text-dim:#8a7fa8;
  --cream:#f6f1e9;
  --line:rgba(185,168,224,0.16);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--sans);
  color:var(--text);
  /* ====== BACKGROUND IMAGE ======
     Paste your image URL between the url('') quotes below.
     Leave it empty to use the soft lavender gradient fallback. */
  --bg-image:url('background.jpg');
  background:#d9cdee;
  background-image:
    /* light lavender veil ON TOP of your image (keeps it bright + airy) */
    linear-gradient(165deg, rgba(225,212,242,0.62) 0%, rgba(214,198,236,0.48) 40%, rgba(208,190,232,0.55) 100%),
    /* your image */
    var(--bg-image),
    /* fallback lavender wash if no image is set */
    linear-gradient(165deg, #e6dcf5 0%, #ddcfee 45%, #d3c0e8 100%);
  background-size:cover, cover, cover;
  background-position:center, center, center;
  background-repeat:no-repeat, no-repeat, no-repeat;
  background-attachment:fixed, fixed, fixed;
  -webkit-font-smoothing:antialiased;
}
/* soft sparkle, kept light-touch so it doesn't muddy the lavender */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 8% 8%, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 18%),
    radial-gradient(1.5px 1.5px at 14% 26%, rgba(255,255,255,0.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 14%, rgba(255,255,255,0.55) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 60%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 34% 74%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 66%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 24% 50%, rgba(255,255,255,0.45) 50%, transparent 51%);
  opacity:0.9;
}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 28px 80px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999}

/* ---------- HEADER (sticky, dark frosted band) ---------- */
header.masthead{
  position:sticky;top:14px;z-index:50;
  margin:14px 0 26px;
  padding:22px 30px;
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
  background:linear-gradient(120deg, #2c2148 0%, #221836 100%);
  border:1px solid rgba(185,168,224,0.3);
  border-radius:22px;
  box-shadow:0 18px 50px rgba(60,40,95,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.brand{display:flex;align-items:center;gap:20px}
.brand-tile{
  width:62px;height:62px;border-radius:18px;flex:0 0 auto;
  background:linear-gradient(150deg, #c9b8ec 0%, #9d86c9 55%, #7c64a8 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(124,100,168,0.5), inset 0 1px 2px rgba(255,255,255,0.5);
}
.brand-tile svg{width:30px;height:30px;color:#2a1f3d}
.brand-text{display:flex;flex-direction:column;gap:5px}
.brand-name{
  font-family:var(--serif);font-weight:600;
  font-size:38px;line-height:1.05;letter-spacing:0.3px;
  background:linear-gradient(100deg, #f3b8d8 0%, #d7b3ec 38%, #b9a8e0 64%, #9d86c9 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.brand-name em{font-style:italic;font-weight:500}
.brand-sub{
  font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:3.5px;
  text-transform:uppercase;color:var(--text-dim);
}
.masthead-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.ready-label{
  font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text-soft);
}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:30px;align-items:start}

/* ---------- PATH SIDEBAR (dark glass) ---------- */
aside.path{
  position:sticky;top:120px;
  background:linear-gradient(160deg, #2a1f44 0%, #1f1638 100%);
  border:1px solid rgba(185,168,224,0.24);
  border-radius:24px;
  padding:26px 22px 28px;
  box-shadow:0 18px 50px rgba(60,40,95,0.30);
}
.path-eyebrow{
  display:flex;align-items:center;gap:7px;
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:var(--lavender);margin-bottom:6px;padding-left:2px;
}
.path-title{
  font-family:var(--serif);font-weight:600;font-size:23px;
  margin-bottom:16px;padding-left:2px;line-height:1.1;
  background:linear-gradient(100deg, #f3b8d8 0%, #ceacec 45%, #b9a8e0 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.progress-track{height:5px;border-radius:3px;background:rgba(185,168,224,0.16);overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--lavender),var(--lavender-bright));width:0%;transition:width .4s ease}
.progress-label{font-family:var(--sans);font-size:11px;color:var(--text-dim);margin-bottom:20px;letter-spacing:.5px}

.welcome-link{
  display:flex;align-items:center;gap:13px;
  padding:13px 12px;border-radius:14px;cursor:pointer;margin-bottom:14px;
  background:linear-gradient(120deg, rgba(155,134,201,0.2), rgba(124,100,168,0.12));
  border:1px solid rgba(185,168,224,0.28);transition:background .16s ease;
}
.welcome-link:hover{background:linear-gradient(120deg, rgba(155,134,201,0.32), rgba(124,100,168,0.2))}
.welcome-link.active{
  background:linear-gradient(120deg, rgba(201,184,236,0.45), rgba(155,134,201,0.32));
  box-shadow:0 4px 16px rgba(0,0,0,0.28);
}
.welcome-spark{
  width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:linear-gradient(150deg,#c9b8ec,#9079c4);color:#2a1f3d;
  box-shadow:0 4px 12px rgba(124,100,168,0.45);
}
.welcome-text{display:flex;flex-direction:column;gap:1px}
.welcome-link .day-num{color:var(--lavender)}
.welcome-link .day-name{font-family:var(--serif);font-weight:600;font-size:18px;color:#fff;line-height:1.15}

.phase{margin-bottom:6px}
.phase-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:none;border:none;cursor:pointer;
  padding:10px 8px;border-radius:12px;text-align:left;
  transition:background .18s ease;
}
.phase-head:hover{background:rgba(185,168,224,0.1)}
.phase-title-wrap{display:flex;flex-direction:column;gap:2px}
.phase-kicker{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--lavender);
}
.phase-name{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--text);line-height:1.1}
.phase-caret{
  width:18px;height:18px;flex:0 0 auto;color:var(--lavender);opacity:.75;
  transition:transform .22s ease;
}
.phase.collapsed .phase-caret{transform:rotate(-90deg)}
.phase-days{
  position:relative;margin:2px 0 8px 14px;padding-left:18px;
  overflow:hidden;transition:max-height .28s ease, opacity .22s ease;
}
.phase.collapsed .phase-days{max-height:0 !important;opacity:0;margin-bottom:0}
.phase-days::before{
  content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1.5px;
  background:linear-gradient(180deg, rgba(185,168,224,0.55), rgba(185,168,224,0.15));
}
.day-link{
  position:relative;display:flex;flex-direction:column;gap:2px;
  padding:9px 10px 9px 6px;border-radius:11px;cursor:pointer;
  transition:background .16s ease;
}
.day-link:hover{background:rgba(185,168,224,0.1)}
.day-link.active{
  background:linear-gradient(120deg, rgba(155,134,201,0.42), rgba(124,100,168,0.3));
  box-shadow:0 4px 16px rgba(0,0,0,0.28);
}
.day-link::before{
  content:"";position:absolute;left:-17px;top:14px;width:11px;height:11px;border-radius:50%;
  background:#241a3a;border:1.5px solid var(--lavender);
  box-shadow:0 0 0 3px rgba(28,20,48,0.9);
}
.day-link.active::before{
  background:radial-gradient(circle at 35% 30%, #fff, var(--lavender));
  box-shadow:0 0 12px rgba(185,168,224,0.95), 0 0 0 3px rgba(28,20,48,0.9);
}
.day-link.done::before{background:var(--lavender);border-color:var(--lavender)}
.day-num{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim)}
.day-link.active .day-num{color:var(--lavender-soft)}
.day-name{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--text-soft);line-height:1.18}
.day-link.active .day-name{color:#fff}
.day-link.locked{opacity:.45}
.day-link.locked .day-name{font-style:italic}

/* ---------- CONTENT STAGE (on dark) ---------- */
main.stage{
  background:linear-gradient(165deg, #271c42 0%, #1c1338 100%);
  border:1px solid rgba(185,168,224,0.2);
  border-radius:28px;
  padding:48px 54px 56px;
  box-shadow:0 24px 70px rgba(60,40,95,0.34);
  min-height:560px;
}
.day-topline{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.day-meta{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim)}
.video-chip{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--lavender-soft);background:rgba(185,168,224,0.12);
  border:1px solid rgba(185,168,224,0.28);border-radius:30px;padding:8px 16px;cursor:pointer;
  transition:background .15s ease;
}
.video-chip:hover{background:rgba(185,168,224,0.2)}
.video-chip svg{width:15px;height:15px}

.day-headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.day-title{
  font-family:var(--serif);font-weight:600;font-size:56px;line-height:1.04;
  letter-spacing:0.3px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(105deg, #f6b6da 0%, #e0b0ec 30%, #c4a4e8 58%, #9d86c9 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 20px rgba(185,120,210,0.25));
}
.day-title em{font-style:italic;font-weight:500}
.mark-pill{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;
  font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text-soft);
  background:rgba(185,168,224,0.08);border:1px solid rgba(185,168,224,0.3);
  border-radius:30px;padding:11px 22px;cursor:pointer;transition:all .15s ease;margin-top:8px;
}
.mark-pill:hover{background:rgba(185,168,224,0.16)}
.mark-pill .ring{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--text-soft);flex:0 0 auto}
.mark-pill.done{color:#fff;border-color:var(--lavender);background:rgba(155,134,201,0.28)}
.mark-pill.done .ring{background:var(--lavender);border-color:var(--lavender);box-shadow:0 0 10px rgba(185,168,224,0.7)}
.day-sub{
  font-family:var(--serif);font-style:italic;font-size:23px;color:var(--text-soft);
  margin-bottom:30px;
}

/* activation slot */
.activation{
  background:linear-gradient(135deg, #6f5aa0 0%, #9079c4 100%);
  border-radius:18px;padding:24px 26px;display:flex;align-items:center;gap:20px;
  margin-bottom:16px;box-shadow:0 14px 34px rgba(80,62,130,0.5);
}
.play-btn{
  width:66px;height:66px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.55);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.play-btn:hover{transform:scale(1.05);background:rgba(255,255,255,0.3)}
.play-btn svg{width:22px;height:22px;color:#fff;margin-left:3px}
.activation-text .label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,0.82);margin-bottom:4px;
}
.activation-text .title{font-family:var(--serif);font-weight:600;font-size:26px;color:#fff;line-height:1.1}
.activation-text .note{font-family:var(--sans);font-size:13px;color:rgba(255,255,255,0.82);margin-top:3px}

/* audio-player activation (real MP3) */
.audio-player{
  display:flex;align-items:center;gap:20px;
  background:linear-gradient(135deg, #6f5aa0 0%, #9079c4 100%);
  border-radius:18px;padding:22px 26px;margin-bottom:16px;
  box-shadow:0 14px 34px rgba(80,62,130,0.5);
}
.audio-body{flex:1 1 auto;min-width:0}
.audio-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
.audio-label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,0.82);
}
.audio-time{font-family:var(--sans);font-size:12.5px;color:rgba(255,255,255,0.85);font-variant-numeric:tabular-nums}
.audio-title{font-family:var(--serif);font-weight:600;font-size:25px;color:#fff;line-height:1.1;margin-bottom:12px}
.audio-track{
  height:7px;border-radius:4px;background:rgba(255,255,255,0.25);cursor:pointer;position:relative;overflow:hidden;
}
.audio-fill{height:100%;width:0%;border-radius:4px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,0.6);transition:width .1s linear}

/* video-style activation (meditation embed) */
.activation-head{margin-bottom:14px}
.activation-head .label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--lavender);margin-bottom:5px;
}
.activation-head .title{font-family:var(--serif);font-weight:600;font-size:27px;color:#fff;line-height:1.1}
.act-video{margin-bottom:14px}
.chapters{list-style:none;margin:0 0 34px;padding:16px 20px;
  background:rgba(185,168,224,0.08);border:1px solid rgba(185,168,224,0.2);border-radius:14px}
.chapters li{display:flex;align-items:baseline;gap:14px;padding:6px 0;font-family:var(--sans)}
.chapters li+li{border-top:1px solid rgba(185,168,224,0.12)}
.chap-time{flex:0 0 auto;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--lavender);font-variant-numeric:tabular-nums;min-width:42px}
.chap-label{font-size:14.5px;color:var(--text-soft)}
.chapters.seekable li{transition:background .14s ease;border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}
.chapters.seekable li:hover{background:rgba(185,168,224,0.14)}
.chapters.seekable li:hover .chap-label{color:var(--text)}

/* teaching video inside a tab */
.teach-video{margin:0 0 26px}

/* numbered ritual steps */
.ritual-intro{font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--lavender-soft);font-style:italic;margin-bottom:14px}
.ritual{list-style:none;margin:0 0 26px;padding:0;counter-reset:none}
.ritual li{display:flex;gap:16px;padding:16px 0;border-top:1px solid rgba(185,168,224,0.14);
  font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--text)}
.ritual li:first-child{border-top:none}
.ritual li strong{color:#fff;font-weight:600}
.ritual li em{font-style:italic;color:var(--lavender-soft)}
.ritual-n{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
  font-family:var(--sans);font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(150deg,#9079c4,#7c64a8);
  box-shadow:0 4px 12px rgba(124,100,168,0.4);
}
.share-note{
  font-family:var(--serif);font-style:italic;font-size:18px;color:var(--text-soft);
  background:rgba(185,168,224,0.08);border-left:3px solid var(--lavender);
  border-radius:0 12px 12px 0;padding:16px 20px;
}
.ground-note{
  font-family:var(--sans);font-size:14.5px;line-height:1.6;color:var(--text-soft);
  background:rgba(185,168,224,0.06);border:1px dashed rgba(185,168,224,0.28);
  border-radius:14px;padding:16px 20px;margin-bottom:18px;
}

/* notice callout (teaching) */
.notice{
  background:linear-gradient(135deg, rgba(232,200,122,0.12), rgba(232,200,122,0.05));
  border:1px solid rgba(232,200,122,0.3);border-radius:16px;
  padding:22px 26px;margin:6px 0 8px;
}
.notice-label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--gold);margin-bottom:8px;
}
.notice p{font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--text);margin:0}

/* reflection prompt + journal */
.prompt-card{
  background:linear-gradient(160deg, rgba(155,134,201,0.14), rgba(124,100,168,0.08));
  border:1px solid rgba(185,168,224,0.26);border-radius:18px;padding:26px 28px;
}
.prompt-q{
  font-family:var(--sans);font-size:17px;line-height:1.55;color:#fff;
  margin-bottom:18px;font-weight:500;
}
.journal{
  width:100%;min-height:140px;resize:none;overflow:hidden;
  background:rgba(14,10,26,0.4);border:1px solid rgba(185,168,224,0.24);
  border-radius:12px;padding:16px 18px;color:var(--text);
  font-family:var(--sans);font-size:15.5px;line-height:1.6;
  transition:border-color .15s ease;
}
.journal:focus{outline:none;border-color:var(--lavender)}
.journal::placeholder{color:var(--text-dim);font-style:italic}
.journal-saved{
  font-family:var(--sans);font-size:12px;color:var(--lavender);
  margin-top:8px;height:16px;opacity:0;transition:opacity .25s ease;letter-spacing:.5px;
}
.journal-saved.show{opacity:1}

/* affirmation */
.affirmation{
  background:linear-gradient(160deg, rgba(155,134,201,0.16), rgba(124,100,168,0.1));
  border:1px solid rgba(185,168,224,0.26);border-radius:20px;
  padding:38px 40px;text-align:center;
}
.affirmation p{
  font-family:var(--serif);font-size:25px;line-height:1.4;color:var(--text);
  margin-bottom:14px;
}
.affirmation p:last-child{margin-bottom:0}
.affirm-seal{
  font-style:italic;font-size:27px !important;margin-top:8px !important;
  background:linear-gradient(105deg, #f6b6da, #c4a4e8, #9d86c9);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}

.listen-hint{
  display:flex;align-items:center;gap:11px;
  background:rgba(185,168,224,0.1);border:1px solid rgba(185,168,224,0.24);
  border-radius:14px;padding:13px 18px;margin-bottom:34px;
  font-family:var(--sans);font-size:14px;color:var(--text-soft);
}
.listen-hint svg{width:17px;height:17px;flex:0 0 auto;color:var(--lavender)}

/* tabs */
.tabs{display:flex;gap:0;border:1px solid rgba(185,168,224,0.2);border-radius:16px;padding:6px;margin-bottom:32px;flex-wrap:wrap;background:rgba(185,168,224,0.06)}
.tab{
  font-family:var(--sans);font-size:15px;font-weight:600;color:var(--text-soft);
  background:none;border:none;cursor:pointer;padding:11px 22px;border-radius:11px;
  display:inline-flex;align-items:center;gap:8px;transition:all .15s ease;
}
.tab:hover{color:var(--text)}
.tab.active{
  color:#fff;
  background:linear-gradient(120deg, rgba(201,184,236,0.9), rgba(155,134,201,0.85));
  box-shadow:0 4px 14px rgba(124,100,168,0.4);
}
.tab .ico{font-size:15px}
.panel{display:none;animation:fade .3s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.body-copy{font-family:var(--sans);font-size:17px;line-height:1.65;color:var(--text)}
.body-copy.lead{font-style:italic;color:var(--text-soft);margin-bottom:22px}
.body-copy p{margin-bottom:20px}

/* loom video embed */
.video-frame{
  position:relative;width:100%;padding-bottom:var(--vid-ratio, 56.25%);height:0;
  border-radius:18px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 16px 40px rgba(0,0,0,0.35);border:1px solid rgba(185,168,224,0.25);
  background:#000;
}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* human design chart card */
.hd-card{
  background:linear-gradient(135deg, rgba(155,134,201,0.22), rgba(124,100,168,0.16));
  border:1px solid rgba(185,168,224,0.32);border-radius:18px;
  padding:26px 28px;margin:8px 0 28px;
}
.hd-card-label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--lavender);margin-bottom:8px;
}
.hd-card-text{font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--text);margin-bottom:18px}
.hd-btn{
  display:inline-block;font-family:var(--sans);font-size:14.5px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#8d76bf,#a892d4);text-decoration:none;
  border-radius:12px;padding:13px 24px;box-shadow:0 8px 20px rgba(141,118,191,0.4);
  transition:transform .15s ease;
}
.hd-btn:hover{transform:translateY(-1px)}

/* cream pull-quote that pops on dark */
.pullquote{
  background:linear-gradient(160deg, #f8f4ec 0%, #efe7da 100%);
  border-radius:18px;padding:34px 40px;margin:8px 0 28px;
  position:relative;box-shadow:0 16px 40px rgba(0,0,0,0.3);
}
.pullquote::before{
  content:'\201C';position:absolute;top:6px;left:22px;
  font-family:var(--serif);font-size:64px;color:var(--lavender);opacity:.6;
}
.pullquote p{font-family:var(--serif);font-style:italic;font-size:25px;line-height:1.4;color:#3a2f52;padding-left:34px}

.placeholder{
  border:1.5px dashed rgba(185,168,224,0.32);border-radius:16px;
  padding:40px 34px;text-align:center;color:var(--text-soft);
  font-family:var(--sans);font-size:14.5px;line-height:1.6;
  background:rgba(185,168,224,0.05);
}
.placeholder strong{color:var(--lavender-soft);font-weight:600}

/* footer nav */
.day-foot{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.nav-btn{
  font-family:var(--sans);font-size:14px;font-weight:600;color:var(--lavender-soft);
  background:rgba(185,168,224,0.1);border:1px solid rgba(185,168,224,0.28);
  border-radius:12px;padding:11px 20px;cursor:pointer;transition:background .15s ease;
}
.nav-btn:hover{background:rgba(185,168,224,0.2)}
.nav-btn:disabled{opacity:.35;cursor:default}

.sig{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--text-soft);margin-top:36px;text-align:right}

/* ---------- RESPONSIVE ---------- */
@media (max-width:880px){
  .wrap{padding:0 16px 60px}
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.path{position:static;margin-bottom:22px}
  main.stage{padding:34px 24px 40px}
  .day-title{font-size:40px}
  .brand-name{font-size:30px}
  .masthead{padding:18px 22px;position:static;top:auto}

}

const STORE_KEY = "recalibrate21_progress";

function saveProgress(p){ try{localStorage.setItem(STORE_KEY,JSON.stringify(p))}catch(e){} }

function updateProgress(){
  const total = 21;
  const done = Object.keys(progress).filter(k=>k!=='0' && progress[k]).length;
  const pct = Math.round(done/total*100);
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  if(fill) fill.style.width = pct+'%';
  if(label) label.textContent = pct+'% complete';
}

function renderPath(){
  const nav = document.getElementById('pathNav');
  const wCls = ['welcome-link'];
  if(current===0) wCls.push('active');
  if(progress[0]) wCls.push('done');
  const welcomeLink = `<div class="${wCls.join(' ')}" data-day="0">
      <span class="welcome-spark">✦</span>
      <span class="welcome-text">
        <span class="day-num">Start Here</span>
        <span class="day-name">Welcome In</span>
      </span>
    </div>`;
  nav.innerHTML = welcomeLink + PHASES.map((ph,pi)=>{
    const isCol = collapsed[pi];
    const days = ph.days.map(d=>{
      const built = d.tabs && d.tabs.length>0;
      const cls = ['day-link'];
      if(d.n===current) cls.push('active');
      if(progress[d.n]) cls.push('done');
      if(!built) cls.push('locked');
      return `<div class="${cls.join(' ')}" data-day="${d.n}">
        <span class="day-num">Day ${d.n}</span>
        <span class="day-name">${d.title || d.name}</span>
      </div>`;
    }).join('');
    return `<div class="phase ${isCol?'collapsed':''}" data-phase="${pi}">
      <button class="phase-head" data-phasehead="${pi}">
        <span class="phase-title-wrap">
          <span class="phase-kicker">${ph.kicker}</span>
          <span class="phase-name">${ph.name}</span>
        </span>
        ${caretSVG}
      </button>
      <div class="phase-days">${days}</div>
    </div>`;
  }).join('');

  updateProgress();

  // set max-height for open phases (smooth collapse)
  document.querySelectorAll('.phase-days').forEach(el=>{
    const parent = el.closest('.phase');
    el.style.maxHeight = parent.classList.contains('collapsed') ? '0px' : el.scrollHeight+40+'px';
  });

  nav.querySelectorAll('[data-phasehead]').forEach(b=>{
    b.onclick=()=>{ const i=+b.dataset.phasehead; collapsed[i]=!collapsed[i]; renderPath(); };
  });
  nav.querySelectorAll('[data-day]').forEach(el=>{
    el.onclick=()=>{ current=+el.dataset.day; renderStage(); renderPath(); };
  });
}

function renderStage(){
  const d = findDay(current);
  const stage = document.getElementById('stage');
  const built = d.tabs && d.tabs.length>0;
  const done = progress[d.n];

  const markPill = `<button class="mark-pill ${done?'done':''}" data-mark><span class="ring"></span>${done?'Completed':'Mark Complete'}</button>`;

  if(d.isWelcome){
    const tabBtnsW = d.tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${t.id}">${t.icon?`<span class="ico">${t.icon}</span>`:''}${t.label}</button>`).join('');
    const panelsW = d.tabs.map((t,i)=>`<div class="panel ${i===0?'active':''}" data-panel="${t.id}">${t.content}</div>`).join('');
    stage.innerHTML = `
      <div class="day-topline"><span class="day-meta">Start Here · Welcome</span></div>
      <div class="day-headrow">
        <h1 class="day-title">${d.title}</h1>
        ${markPill}
      </div>
      ${d.sub?`<div class="day-sub">${d.sub}</div>`:''}
      <div class="video-frame" style="--vid-ratio:66.67%"><iframe src="${d.loom}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe></div>
      <div class="tabs">${tabBtnsW}</div>
      ${panelsW}
      ${footNav(d)}`;
    stage.querySelectorAll('.tab').forEach(b=>{
      b.onclick=()=>{
        stage.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        stage.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        stage.querySelector(`[data-panel="${b.dataset.tab}"]`).classList.add('active');
      };
    });
    bindFoot(d);
    return;
  }

  if(!built){
    stage.innerHTML = `
      <div class="day-topline"><span class="day-meta">Day ${d.n} of 21</span></div>
      <div class="day-headrow">
        <h1 class="day-title">${d.name}</h1>
        ${markPill}
      </div>
      <div class="placeholder">
        <strong>Day ${d.n} is ready for content.</strong><br>
        Paste this day's email and practices and I'll shape it into the tabs.
      </div>
      ${footNav(d)}`;
    bindFoot(d);
    return;
  }

  const topline = `<div class="day-topline">
      <span class="day-meta">Day ${d.n} of 21</span>
    </div>`;

  let act = '';
  if(d.activation && d.activation.audio){
    const chapters = (d.activation.chapters||[]).map(c=>`<li data-seek="${c.sec}"><span class="chap-time">${c.time}</span><span class="chap-label">${c.label}</span></li>`).join('');
    act = `
      <div class="audio-player">
        <button class="play-btn" id="audPlay" aria-label="Play meditation">${playSVG}</button>
        <div class="audio-body">
          <div class="audio-head">
            <span class="audio-label">${d.activation.label}</span>
            <span class="audio-time"><span id="audCur">0:00</span> / <span id="audDur">--:--</span></span>
          </div>
          <div class="audio-title">${d.activation.title}</div>
          <div class="audio-track" id="audTrack"><div class="audio-fill" id="audFill"></div></div>
        </div>
        <audio id="audEl" preload="metadata" src="${d.activation.audio}"></audio>
      </div>
      ${chapters?`<ul class="chapters seekable">${chapters}</ul>`:''}`;
  } else if(d.activation && d.activation.embed){
    const chapters = (d.activation.chapters||[]).map(c=>`<li><span class="chap-time">${c.time}</span><span class="chap-label">${c.label}</span></li>`).join('');
    act = `
      <div class="activation-head">
        <div class="label">${d.activation.label}</div>
        <div class="title">${d.activation.title}</div>
      </div>
      <div class="video-frame act-video"><iframe src="${d.activation.embed}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe></div>
      ${chapters?`<ul class="chapters">${chapters}</ul>`:''}`;
  } else if(d.activation){
    act = `
    <div class="activation">
      <button class="play-btn" aria-label="Play activation">${playSVG}</button>
      <div class="activation-text">
        <div class="label">${d.activation.label}</div>
        <div class="title">${d.activation.title}</div>
        ${d.activation.note?`<div class="note">${d.activation.note}</div>`:''}
      </div>
    </div>`;
  }

  const hint = d.hint ? `
    <div class="listen-hint">${headphoneSVG}<span>Press play and listen first. The teaching below is here to read alongside or after.</span></div>` : '';

  const tabBtns = d.tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${t.id}">${t.icon?`<span class="ico">${t.icon}</span>`:''}${t.label}</button>`).join('');
  const panels = d.tabs.map((t,i)=>{
    const inner = t.content || `<div class="placeholder">${t.placeholder||'Content coming.'}</div>`;
    return `<div class="panel ${i===0?'active':''}" data-panel="${t.id}">${inner}</div>`;
  }).join('');

  stage.innerHTML = `
    ${topline}
    <div class="day-headrow">
      <h1 class="day-title">${d.title||d.name}</h1>
      ${markPill}
    </div>
    ${d.sub?`<div class="day-sub">${d.sub}</div>`:''}
    ${act}${hint}
    <div class="tabs">${tabBtns}</div>
    ${panels}
    ${footNav(d)}`;

  stage.querySelectorAll('.tab').forEach(b=>{
    b.onclick=()=>{
      stage.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      stage.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      stage.querySelector(`[data-panel="${b.dataset.tab}"]`).classList.add('active');
    };
  });
  bindAudio(stage);
  bindJournal(stage);
  bindFoot(d);
}

const pauseSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function fmtTime(s){ if(!isFinite(s)||s<0)s=0; const m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
function bindAudio(stage){
  const el=stage.querySelector('#audEl'); if(!el) return;
  const playBtn=stage.querySelector('#audPlay');
  const fill=stage.querySelector('#audFill');
  const track=stage.querySelector('#audTrack');
  const cur=stage.querySelector('#audCur');
  const dur=stage.querySelector('#audDur');
  el.addEventListener('loadedmetadata',()=>{ dur.textContent=fmtTime(el.duration); });
  el.addEventListener('timeupdate',()=>{
    cur.textContent=fmtTime(el.currentTime);
    if(el.duration) fill.style.width=(el.currentTime/el.duration*100)+'%';
  });
  el.addEventListener('ended',()=>{ playBtn.innerHTML=playSVG; });
  playBtn.onclick=()=>{
    if(el.paused){ el.play(); playBtn.innerHTML=pauseSVG; }
    else { el.pause(); playBtn.innerHTML=playSVG; }
  };
  if(track) track.onclick=(e)=>{
    const r=track.getBoundingClientRect();
    const pct=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
    if(el.duration) el.currentTime=pct*el.duration;
  };
  stage.querySelectorAll('.chapters.seekable li[data-seek]').forEach(li=>{
    li.style.cursor='pointer';
    li.onclick=()=>{ el.currentTime=+li.dataset.seek; if(el.paused){el.play(); if(playBtn) playBtn.innerHTML=pauseSVG;} };
  });
}

const JKEY='recalibrate21_journal';
function loadJournal(){ try{return JSON.parse(localStorage.getItem(JKEY))||{}}catch(e){return {}} }
function saveJournal(o){ try{localStorage.setItem(JKEY,JSON.stringify(o))}catch(e){} }
function bindJournal(stage){
  const store=loadJournal();
  stage.querySelectorAll('.journal[data-journal]').forEach(ta=>{
    const key=ta.dataset.journal;
    if(store[key]) ta.value=store[key];
    const savedEl=stage.querySelector(`[data-saved="${key}"]`);
    let t=null;
    const autosize=()=>{ ta.style.height='auto'; ta.style.height=Math.max(140,ta.scrollHeight)+'px'; };
    autosize();
    ta.addEventListener('input',()=>{
      autosize();
      const s=loadJournal(); s[key]=ta.value; saveJournal(s);
      if(savedEl){ savedEl.textContent='Saved'; savedEl.classList.add('show'); clearTimeout(t); t=setTimeout(()=>savedEl.classList.remove('show'),1400); }
    });
  });
}

function footNav(d){
  const prevOk = d.n>0, nextOk = d.n<21;
  const prevLabel = d.n===1 ? '← Welcome' : (prevOk ? `← Day ${d.n-1}` : '←');
  const nextLabel = d.n===0 ? 'Day 1 →' : (nextOk ? `Day ${d.n+1} →` : '→');
  return `<div class="day-foot">
    <button class="nav-btn" data-prev ${prevOk?'':'disabled'}>${prevLabel}</button>
    <button class="nav-btn" data-next ${nextOk?'':'disabled'}>${nextLabel}</button>
  </div>`;
}
/* ---- purple & lavender confetti on completing a day ---- */
const CONFETTI_COLORS = ['#9d86c9','#b9a8e0','#c9b8ec','#8d76bf','#d7cdee','#7c64a8','#e8c87a'];
let _confettiPieces=[], _confettiRAF=null, _confettiCanvas=null, _confettiCtx=null;
function _confettiResize(){
  if(!_confettiCanvas) return;
  const dpr=window.devicePixelRatio||1;
  _confettiCanvas.width=window.innerWidth*dpr;
  _confettiCanvas.height=window.innerHeight*dpr;
  _confettiCtx.setTransform(dpr,0,0,dpr,0,0);
}
function fireConfetti(x,y){
  if(!_confettiCanvas){
    _confettiCanvas=document.getElementById('confetti');
    _confettiCtx=_confettiCanvas.getContext('2d');
    _confettiResize();
    window.addEventListener('resize',_confettiResize);
  }
  const cx=(x==null)?window.innerWidth/2:x;
  const cy=(y==null)?window.innerHeight/2:y;
  for(let i=0;i<90;i++){
    const ang=Math.random()*Math.PI*2;
    const speed=4+Math.random()*7;
    _confettiPieces.push({
      x:cx, y:cy,
      vx:Math.cos(ang)*speed,
      vy:Math.sin(ang)*speed-4,
      g:0.18+Math.random()*0.1,
      size:5+Math.random()*6,
      rot:Math.random()*Math.PI,
      vr:(Math.random()-0.5)*0.3,
      color:CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
      life:0, ttl:70+Math.random()*40,
      shape:Math.random()<0.5?'rect':'circ'
    });
  }
  if(!_confettiRAF) _confettiRAF=requestAnimationFrame(_confettiTick);
}
function _confettiTick(){
  _confettiCtx.clearRect(0,0,_confettiCanvas.width,_confettiCanvas.height);
  for(let i=_confettiPieces.length-1;i>=0;i--){
    const p=_confettiPieces[i];
    p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=0.99;
    const alpha=Math.max(0,1-p.life/p.ttl);
    _confettiCtx.save();
    _confettiCtx.globalAlpha=alpha;
    _confettiCtx.translate(p.x,p.y);
    _confettiCtx.rotate(p.rot);
    _confettiCtx.fillStyle=p.color;
    if(p.shape==='rect') _confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.55);
    else { _confettiCtx.beginPath(); _confettiCtx.arc(0,0,p.size/2,0,Math.PI*2); _confettiCtx.fill(); }
    _confettiCtx.restore();
    if(p.life>=p.ttl||p.y>window.innerHeight+40) _confettiPieces.splice(i,1);
  }
  if(_confettiPieces.length) _confettiRAF=requestAnimationFrame(_confettiTick);
  else { _confettiRAF=null; _confettiCtx.clearRect(0,0,_confettiCanvas.width,_confettiCanvas.height); }
}

function bindFoot(d){
  const stage=document.getElementById('stage');
  const prev=stage.querySelector('[data-prev]'), next=stage.querySelector('[data-next]'), mark=stage.querySelector('[data-mark]');
  if(prev) prev.onclick=()=>{ if(d.n>0){current=d.n-1;openPhaseFor(current);renderStage();renderPath();window.scrollTo({top:0,behavior:'smooth'});} };
  if(next) next.onclick=()=>{ if(d.n<21){current=d.n+1;openPhaseFor(current);renderStage();renderPath();window.scrollTo({top:0,behavior:'smooth'});} };
  if(mark) mark.onclick=()=>{
    const wasDone=!!progress[d.n];
    progress[d.n]=!progress[d.n];
    saveProgress(progress);
    if(!wasDone){
      const r=mark.getBoundingClientRect();
      fireConfetti(r.left+r.width/2, r.top+r.height/2);
    }
    renderStage(); renderPath();
  };
}
function openPhaseFor(n){
  PHASES.forEach((ph,pi)=>{ if(ph.days.some(d=>d.n===n)) collapsed[pi]=false; });
}

/* smart entry: newcomers land on Welcome; returning visitors resume */
(function init(){
  const started = Object.keys(progress).some(k=>progress[k]);
  if(!started){
    current = 0;
  } else {
    const firstUnfinished = flatDays.find(d=>d.tabs.length>0 && !progress[d.n]);
    current = firstUnfinished ? firstUnfinished.n : 1;
  }
  openPhaseFor(current);
  renderPath();
  renderStage();
})();
</script>
