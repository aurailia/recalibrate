<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recalibrate · 21 Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0e0a1a;
  --night-2:#171029;
  --plum-deep:#1c1430;
  --plum:#2e2348;
  --plum-glass:rgba(60,46,92,0.42);
  --lavender:#b9a8e0;
  --lavender-soft:#d7cdee;
  --lavender-bright:#c9b8ec;
  --gold:#e8c87a;
  --text:#e9e3f6;
  --text-soft:#b3a8cc;
  --text-dim:#8a7fa8;
  --cream:#f6f1e9;
  --line:rgba(185,168,224,0.16);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--sans);
  color:var(--text);
  /* ====== BACKGROUND IMAGE ======
     Paste your image URL between the url('') quotes below.
     Leave it empty to use the soft lavender gradient fallback. */
  --bg-image:url('background.jpg');
  background:#d9cdee;
  background-image:
    /* light lavender veil ON TOP of your image (keeps it bright + airy) */
    linear-gradient(165deg, rgba(225,212,242,0.62) 0%, rgba(214,198,236,0.48) 40%, rgba(208,190,232,0.55) 100%),
    /* your image */
    var(--bg-image),
    /* fallback lavender wash if no image is set */
    linear-gradient(165deg, #e6dcf5 0%, #ddcfee 45%, #d3c0e8 100%);
  background-size:cover, cover, cover;
  background-position:center, center, center;
  background-repeat:no-repeat, no-repeat, no-repeat;
  background-attachment:fixed, fixed, fixed;
  -webkit-font-smoothing:antialiased;
}
/* soft sparkle, kept light-touch so it doesn't muddy the lavender */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 8% 8%, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 18%),
    radial-gradient(1.5px 1.5px at 14% 26%, rgba(255,255,255,0.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 14%, rgba(255,255,255,0.55) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 60%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 34% 74%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 66%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 24% 50%, rgba(255,255,255,0.45) 50%, transparent 51%);
  opacity:0.9;
}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 28px 80px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999}

/* My Notes button + panel */
.notes-btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg, rgba(201,184,236,0.3), rgba(155,134,201,0.24));
  border:1px solid rgba(185,168,224,0.4);border-radius:30px;padding:10px 20px;cursor:pointer;
  transition:background .15s ease, transform .15s ease;
}
.notes-btn:hover{background:linear-gradient(135deg, rgba(201,184,236,0.45), rgba(155,134,201,0.38));transform:translateY(-1px)}
.notes-btn svg{width:16px;height:16px}
.notes-overlay{
  position:fixed;inset:0;background:rgba(12,8,23,0.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .25s ease, visibility .25s ease;z-index:1000;
}
.notes-overlay.open{opacity:1;visibility:visible}
.notes-panel{
  position:fixed;top:0;right:0;height:100%;width:min(480px,92vw);z-index:1001;
  background:linear-gradient(165deg, #241a3c 0%, #1b1333 100%);
  border-left:1px solid rgba(185,168,224,0.22);
  box-shadow:-20px 0 60px rgba(0,0,0,0.5);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding:30px 30px 0;
}
.notes-panel.open{transform:translateX(0)}
.notes-panel-head{display:flex;align-items:center;justify-content:space-between}
.notes-panel-title{
  font-family:var(--serif);font-weight:600;font-size:30px;
  background:linear-gradient(100deg, #f3b8d8, #ceacec 50%, #b9a8e0);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.notes-close{
  background:none;border:none;color:var(--text-soft);font-size:32px;line-height:1;cursor:pointer;
  width:38px;height:38px;border-radius:50%;transition:background .15s ease,color .15s ease;
}
.notes-close:hover{background:rgba(185,168,224,0.14);color:#fff}
.notes-panel-sub{font-family:var(--sans);font-size:13.5px;color:var(--text-dim);margin-top:4px}
.notes-actions{margin:18px 0 6px}
.notes-download{
  width:100%;font-family:var(--sans);font-size:14.5px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#8d76bf,#a892d4);border:none;border-radius:12px;
  padding:14px;cursor:pointer;box-shadow:0 8px 20px rgba(141,118,191,0.4);transition:transform .15s ease;
}
.notes-download:hover{transform:translateY(-1px)}
.notes-download:disabled{opacity:.4;cursor:default;transform:none}
.notes-body{flex:1 1 auto;overflow-y:auto;margin:18px -6px 0;padding:0 6px 30px}
.notes-day{margin-bottom:26px}
.notes-day-title{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--lavender);margin-bottom:4px;
}
.notes-day-name{font-family:var(--serif);font-weight:600;font-size:21px;color:#fff;margin-bottom:12px;line-height:1.1}
.notes-entry{
  background:rgba(185,168,224,0.06);border:1px solid rgba(185,168,224,0.16);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;
}
.notes-entry-label{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.notes-entry-text{font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--text);white-space:pre-wrap}
.notes-grat li{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--text);margin-bottom:8px;list-style:none}
.notes-grat li span{color:var(--text-soft)}
.notes-empty{font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--text-soft);text-align:center;padding:40px 10px;font-style:italic}

/* ---------- HEADER (sticky, dark frosted band) ---------- */
header.masthead{
  position:sticky;top:14px;z-index:50;
  margin:14px 0 26px;
  padding:22px 30px;
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
  background:linear-gradient(120deg, #2c2148 0%, #221836 100%);
  border:1px solid rgba(185,168,224,0.3);
  border-radius:22px;
  box-shadow:0 18px 50px rgba(60,40,95,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.brand{display:flex;align-items:center;gap:20px}
.brand-tile{
  width:62px;height:62px;border-radius:18px;flex:0 0 auto;
  background:linear-gradient(150deg, #c9b8ec 0%, #9d86c9 55%, #7c64a8 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(124,100,168,0.5), inset 0 1px 2px rgba(255,255,255,0.5);
}
.brand-tile svg{width:30px;height:30px;color:#2a1f3d}
.brand-text{display:flex;flex-direction:column;gap:5px}
.brand-name{
  font-family:var(--serif);font-weight:600;
  font-size:38px;line-height:1.05;letter-spacing:0.3px;
  background:linear-gradient(100deg, #f3b8d8 0%, #d7b3ec 38%, #b9a8e0 64%, #9d86c9 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.brand-name em{font-style:italic;font-weight:500}
.brand-sub{
  font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:3.5px;
  text-transform:uppercase;color:var(--text-dim);
}
.masthead-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.ready-label{
  font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text-soft);
}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:30px;align-items:start}

/* ---------- PATH SIDEBAR (dark glass) ---------- */
aside.path{
  position:sticky;top:120px;
  background:linear-gradient(160deg, #2a1f44 0%, #1f1638 100%);
  border:1px solid rgba(185,168,224,0.24);
  border-radius:24px;
  padding:26px 22px 28px;
  box-shadow:0 18px 50px rgba(60,40,95,0.30);
}
.path-eyebrow{
  display:flex;align-items:center;gap:7px;
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:var(--lavender);margin-bottom:6px;padding-left:2px;
}
.path-title{
  font-family:var(--serif);font-weight:600;font-size:23px;
  margin-bottom:16px;padding-left:2px;line-height:1.1;
  background:linear-gradient(100deg, #f3b8d8 0%, #ceacec 45%, #b9a8e0 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.progress-track{height:5px;border-radius:3px;background:rgba(185,168,224,0.16);overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--lavender),var(--lavender-bright));width:0%;transition:width .4s ease}
.progress-label{font-family:var(--sans);font-size:11px;color:var(--text-dim);margin-bottom:20px;letter-spacing:.5px}

.welcome-link{
  display:flex;align-items:center;gap:13px;
  padding:13px 12px;border-radius:14px;cursor:pointer;margin-bottom:14px;
  background:linear-gradient(120deg, rgba(155,134,201,0.2), rgba(124,100,168,0.12));
  border:1px solid rgba(185,168,224,0.28);transition:background .16s ease;
}
.welcome-link:hover{background:linear-gradient(120deg, rgba(155,134,201,0.32), rgba(124,100,168,0.2))}
.welcome-link.active{
  background:linear-gradient(120deg, rgba(201,184,236,0.45), rgba(155,134,201,0.32));
  box-shadow:0 4px 16px rgba(0,0,0,0.28);
}
.welcome-spark{
  width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:linear-gradient(150deg,#c9b8ec,#9079c4);color:#2a1f3d;
  box-shadow:0 4px 12px rgba(124,100,168,0.45);
}
.welcome-text{display:flex;flex-direction:column;gap:1px}
.welcome-link .day-num{color:var(--lavender)}
.welcome-link .day-name{font-family:var(--serif);font-weight:600;font-size:18px;color:#fff;line-height:1.15}

.phase{margin-bottom:6px}
.phase-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:none;border:none;cursor:pointer;
  padding:10px 8px;border-radius:12px;text-align:left;
  transition:background .18s ease;
}
.phase-head:hover{background:rgba(185,168,224,0.1)}
.phase-title-wrap{display:flex;flex-direction:column;gap:2px}
.phase-kicker{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--lavender);
}
.phase-name{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--text);line-height:1.1}
.phase-caret{
  width:18px;height:18px;flex:0 0 auto;color:var(--lavender);opacity:.75;
  transition:transform .22s ease;
}
.phase.collapsed .phase-caret{transform:rotate(-90deg)}
.phase-days{
  position:relative;margin:2px 0 8px 14px;padding-left:18px;
  overflow:hidden;transition:max-height .28s ease, opacity .22s ease;
}
.phase.collapsed .phase-days{max-height:0 !important;opacity:0;margin-bottom:0}
.phase-days::before{
  content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1.5px;
  background:linear-gradient(180deg, rgba(185,168,224,0.55), rgba(185,168,224,0.15));
}
.day-link{
  position:relative;display:flex;flex-direction:column;gap:2px;
  padding:9px 10px 9px 6px;border-radius:11px;cursor:pointer;
  transition:background .16s ease;
}
.day-link:hover{background:rgba(185,168,224,0.1)}
.day-link.active{
  background:linear-gradient(120deg, rgba(155,134,201,0.42), rgba(124,100,168,0.3));
  box-shadow:0 4px 16px rgba(0,0,0,0.28);
}
.day-link::before{
  content:"";position:absolute;left:-17px;top:14px;width:11px;height:11px;border-radius:50%;
  background:#241a3a;border:1.5px solid var(--lavender);
  box-shadow:0 0 0 3px rgba(28,20,48,0.9);
}
.day-link.active::before{
  background:radial-gradient(circle at 35% 30%, #fff, var(--lavender));
  box-shadow:0 0 12px rgba(185,168,224,0.95), 0 0 0 3px rgba(28,20,48,0.9);
}
.day-link.done::before{background:var(--lavender);border-color:var(--lavender)}
.day-num{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim)}
.day-link.active .day-num{color:var(--lavender-soft)}
.day-name{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--text-soft);line-height:1.18}
.day-link.active .day-name{color:#fff}
.day-link.locked{opacity:.45}
.day-link.locked .day-name{font-style:italic}
.day-link.daylocked{opacity:.5;position:relative}
.day-link.daylocked .day-name{color:var(--text-dim)}
.day-link.daylocked .day-num{color:var(--text-dim)}
.lock-ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-dim)}
.lock-ico svg{width:14px;height:14px;display:block}

/* locked day screen */
.locked-screen{text-align:center;padding:60px 30px 40px;max-width:520px;margin:0 auto}
.locked-orb{
  width:88px;height:88px;border-radius:50%;margin:0 auto 26px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg, rgba(155,134,201,0.3), rgba(124,100,168,0.18));
  border:1px solid rgba(185,168,224,0.3);
}
.locked-orb svg{width:38px;height:38px;color:var(--lavender)}
.locked-title{
  font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:16px;
  background:linear-gradient(105deg,#f6b6da,#c4a4e8,#9d86c9);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.locked-text{font-family:var(--sans);font-size:16px;line-height:1.65;color:var(--text-soft);margin-bottom:14px}
.locked-sub{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--text-dim)}

/* ---------- CONTENT STAGE (on dark) ---------- */
main.stage{
  background:linear-gradient(165deg, #271c42 0%, #1c1338 100%);
  border:1px solid rgba(185,168,224,0.2);
  border-radius:28px;
  padding:48px 54px 56px;
  box-shadow:0 24px 70px rgba(60,40,95,0.34);
  min-height:560px;
}
.day-topline{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.day-meta{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim)}
.video-chip{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--lavender-soft);background:rgba(185,168,224,0.12);
  border:1px solid rgba(185,168,224,0.28);border-radius:30px;padding:8px 16px;cursor:pointer;
  transition:background .15s ease;
}
.video-chip:hover{background:rgba(185,168,224,0.2)}
.video-chip svg{width:15px;height:15px}

.day-headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.day-title{
  font-family:var(--serif);font-weight:600;font-size:56px;line-height:1.04;
  letter-spacing:0.3px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(105deg, #f6b6da 0%, #e0b0ec 30%, #c4a4e8 58%, #9d86c9 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 20px rgba(185,120,210,0.25));
}
.day-title em{font-style:italic;font-weight:500}
.mark-pill{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;
  font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text-soft);
  background:rgba(185,168,224,0.08);border:1px solid rgba(185,168,224,0.3);
  border-radius:30px;padding:11px 22px;cursor:pointer;transition:all .15s ease;margin-top:8px;
}
.mark-pill:hover{background:rgba(185,168,224,0.16)}
.mark-pill .ring{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--text-soft);flex:0 0 auto}
.mark-pill.done{color:#fff;border-color:var(--lavender);background:rgba(155,134,201,0.28)}
.mark-pill.done .ring{background:var(--lavender);border-color:var(--lavender);box-shadow:0 0 10px rgba(185,168,224,0.7)}
.day-sub{
  font-family:var(--serif);font-style:italic;font-size:23px;color:var(--text-soft);
  margin-bottom:30px;
}

/* activation slot */
.activation{
  background:linear-gradient(135deg, #6f5aa0 0%, #9079c4 100%);
  border-radius:18px;padding:24px 26px;display:flex;align-items:center;gap:20px;
  margin-bottom:16px;box-shadow:0 14px 34px rgba(80,62,130,0.5);
}
.play-btn{
  width:66px;height:66px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.55);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.play-btn:hover{transform:scale(1.05);background:rgba(255,255,255,0.3)}
.play-btn svg{width:22px;height:22px;color:#fff;margin-left:3px}
.activation-text .label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,0.82);margin-bottom:4px;
}
.activation-text .title{font-family:var(--serif);font-weight:600;font-size:26px;color:#fff;line-height:1.1}
.activation-text .note{font-family:var(--sans);font-size:13px;color:rgba(255,255,255,0.82);margin-top:3px}

/* audio-player activation (real MP3) */
.audio-player{
  display:flex;align-items:center;gap:20px;
  background:linear-gradient(135deg, #6f5aa0 0%, #9079c4 100%);
  border-radius:18px;padding:22px 26px;margin-bottom:16px;
  box-shadow:0 14px 34px rgba(80,62,130,0.5);
}
.audio-body{flex:1 1 auto;min-width:0}
.audio-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
.audio-label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,0.82);
}
.audio-time{font-family:var(--sans);font-size:12.5px;color:rgba(255,255,255,0.85);font-variant-numeric:tabular-nums}
.audio-title{font-family:var(--serif);font-weight:600;font-size:25px;color:#fff;line-height:1.1;margin-bottom:12px}
.audio-track{
  height:7px;border-radius:4px;background:rgba(255,255,255,0.25);cursor:pointer;position:relative;overflow:hidden;
}
.audio-fill{height:100%;width:0%;border-radius:4px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,0.6);transition:width .1s linear}

/* video-style activation (meditation embed) */
.activation-head{margin-bottom:14px}
.activation-head .label{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--lavender);margin-bottom:5px;
}
.activation-head .title{font-family:var(--serif);font-weight:600;font-size:27px;color:#fff;line-height:1.1}
.act-video{margin-bottom:14px}
.chapters{list-style:none;margin:0 0 34px;padding:16px 20px;
  background:rgba(185,168,224,0.08);border:1px solid rgba(185,168,224,0.2);border-radius:14px}
.chapters li{display:flex;align-items:baseline;gap:14px;padding:6px 0;font-family:var(--sans)}
.chapters li+li{border-top:1px solid rgba(185,168,224,0.12)}
.chap-time{flex:0 0 auto;font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--lavender);font-variant-numeric:tabular-nums;min-width:42px}

PHASES[0].days[0] = {
  n:1, name:"Your Highest Timeline",
  title:"Your Highest Timeline",

  tabs:[
    {id:"teaching", label:"The Teaching", icon:"✦", content:`
      <div class="video-frame teach-video" style="--vid-ratio:66.67%"><iframe src="https://www.loom.com/embed/39b700ee7e8b4f429054d40538f2d617" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe></div>
      <ul class="chapters">

      </ul>
      <div class="body-copy">
        <p>Today I want to remind you that you're an infinite soul, and you can do anything you set your heart on.</p>
        <p>We've been conditioned to think small. To do what society says is possible. That old way of thinking has kept us from what we actually can do. You're more capable than you think.</p>
        <p>That vision you have, of a fuller and freer life, is meant for you. The Universe wouldn't be handing you those nudges and yearnings if you weren't meant to live them. That's you connecting to your highest timeline.</p>
      </div>

      </div>`},
    {id:"practice", label:"The Practice", icon:"🌙", content:`
      <div class="body-copy">
        <p>Today you're recalibrating to the desires and dreams you want to bring to life. To do that, you have to get clear on what you actually want to create. This is the first step before we move into gratitude and raising your frequency.</p>
      </div>
      <div class="audio-player">
        <button class="play-btn" aria-label="Play meditation">${'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}</button>
        <div class="audio-body">
          <div class="audio-head">
            <span class="audio-label">Highest Timeline Meditation</span>
            <span class="audio-time"><span class="audio-cur">0:00</span> / <span class="audio-dur">--:--</span></span>
          </div>
          <div class="audio-title">Press play and let me guide you</div>
          <div class="audio-track"><div class="audio-fill"></div></div>
        </div>
        <audio preload="metadata" src="https://www.dropbox.com/scl/fi/odo572q3pmvwf0cna35g8/highest-self-embodiment-meditation.mp3?rlkey=ikhlkcruldih9quw8wolag1ww&raw=1"></audio>
      </div>
      <ol class="ritual">
        <li><span class="ritual-n">1</span><div><strong>Find your rock or crystal.</strong> Pick one that will be the symbol of the life you're creating. It doesn't have to be fancy. It just has to mean something to you.</div></li>
        <li><span class="ritual-n">2</span><div><strong>Listen to the Highest Timeline meditation</strong> above. I'll guide you to connect with the future version of you, the one already living your highest timeline.</div></li>
        <li><span class="ritual-n">3</span><div><strong>Send it into the stone.</strong> Pour all the emotion and feeling of living that life into the rock, and seal it with love.</div></li>
        <li><span class="ritual-n">4</span><div><strong>Carry it for the whole 21 days.</strong> This stone is your anchor for the journey, not just today. Keep it on you, or somewhere you'll see it, and connect with it through the day even for 30 seconds. Set it by your bed at night. First thing in the morning, grab it and say <em>thank you, thank you, thank you</em> while you imagine waking up to that life. Picture the day. Feel what it feels like to have everything you desire. Stay in that feeling for a couple of minutes. Every time you touch it, you come back to the vision.</div></li>
      </ol>

const pauseSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function fmtTime(s){ if(!isFinite(s)||s<0)s=0; const m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
function bindAudio(stage){
  const players=stage.querySelectorAll('.audio-player'); if(!players.length) return;
  players.forEach(player=>{
    const el=player.querySelector('audio'); if(!el) return;
    const playBtn=player.querySelector('.play-btn');
    const fill=player.querySelector('.audio-fill');
    const track=player.querySelector('.audio-track');
    const cur=player.querySelector('.audio-cur');
    const dur=player.querySelector('.audio-dur');
    el.addEventListener('loadedmetadata',()=>{ if(dur) dur.textContent=fmtTime(el.duration); });
    el.addEventListener('timeupdate',()=>{
      if(cur) cur.textContent=fmtTime(el.currentTime);
      if(el.duration&&fill) fill.style.width=(el.currentTime/el.duration*100)+'%';
    });
    el.addEventListener('ended',()=>{ if(playBtn) playBtn.innerHTML=playSVG; });
    if(playBtn) playBtn.onclick=()=>{
      if(el.paused){
        // pause any other players on the page first
        stage.querySelectorAll('.audio-player audio').forEach(other=>{ if(other!==el){ other.pause(); }});
        stage.querySelectorAll('.audio-player .play-btn').forEach(b=>{ if(b!==playBtn) b.innerHTML=playSVG; });
        el.play(); playBtn.innerHTML=pauseSVG;
      } else { el.pause(); playBtn.innerHTML=playSVG; }
    };
    if(track) track.onclick=(e)=>{
      const r=track.getBoundingClientRect();
      const pct=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
      if(el.duration) el.currentTime=pct*el.duration;
    };
    player.querySelectorAll('.chapters.seekable li[data-seek]').forEach(li=>{
      li.style.cursor='pointer';
      li.onclick=()=>{ el.currentTime=+li.dataset.seek; if(el.paused){el.play(); if(playBtn) playBtn.innerHTML=pauseSVG;} };
    });
  });
}

function notesHasContent(store){
  return NOTES_MAP.some(d=>d.entries.some(e=>{
    if(e.type==='text') return store[e.key]&&store[e.key].trim();
    if(e.type==='gratitude') return [1,2,3,4,5].some(i=>store[e.prefix+'-g'+i]&&store[e.prefix+'-g'+i].trim());
    return false;
  }));
}
function compileNotesData(store){
  const days=[];
  NOTES_MAP.forEach(d=>{
    const blocks=[];
    d.entries.forEach(e=>{
      if(e.type==='text'){
        const v=(store[e.key]||'').trim();
        if(v) blocks.push({label:e.label, kind:'text', text:v});
      } else if(e.type==='gratitude'){
        const items=[];
        for(let i=1;i<=5;i++){
          const g=(store[e.prefix+'-g'+i]||'').trim();
          const w=(store[e.prefix+'-w'+i]||'').trim();
          if(g) items.push({thing:g, why:w});
        }
        if(items.length) blocks.push({label:e.label, kind:'gratitude', items});
      }
    });
    if(blocks.length) days.push({day:d.day, name:d.name, blocks});
  });
  return days;
}

  const dlBtn=document.getElementById('notesDownload');
  const data=compileNotesData(store);
  body.innerHTML='';

  data.forEach(d=>{

    const n=document.createElement('div'); n.className='notes-day-name'; n.textContent=d.name;
    wrap.appendChild(t); wrap.appendChild(n);
    d.blocks.forEach(b=>{
      const entry=document.createElement('div'); entry.className='notes-entry';
      const lbl=document.createElement('div'); lbl.className='notes-entry-label'; lbl.textContent=b.label;
      entry.appendChild(lbl);
      if(b.kind==='text'){
        const tx=document.createElement('div'); tx.className='notes-entry-text'; tx.textContent=b.text;
        entry.appendChild(tx);
      } else {
        const ul=document.createElement('ul'); ul.className='notes-grat';

      }
      wrap.appendChild(entry);
    });
    body.appendChild(wrap);
  });
}
function buildNotesText(){
  const store=loadJournal();
  const data=compileNotesData(store);
  let out='MY RECALIBRATE NOTES\n';

  out+='Saved '+new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})+'\n';
  out+='\n========================================\n\n';
  data.forEach(d=>{

      } else {
        out+=b.label+':\n';
        b.items.forEach((it,i)=>{ out+=(i+1)+'. '+it.thing+(it.why?' — '+it.why:'')+'\n'; });
        out+='\n';
      }
    });
    out+='----------------------------------------\n\n';
  });
  out+='To living our dreams. — Aurailia \u2726\n';
  return out;
}
function downloadNotes(){
  const text=buildNotesText();
  const blob=new Blob([text],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='My-Recalibrate-Notes.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function openNotes(){ renderNotesPanel(); document.getElementById('notesOverlay').classList.add('open'); document.getElementById('notesPanel').classList.add('open'); }
function closeNotes(){ document.getElementById('notesOverlay').classList.remove('open'); document.getElementById('notesPanel').classList.remove('open'); }
(function wireNotes(){
  const btn=document.getElementById('notesBtn');
  const close=document.getElementById('notesClose');
  const overlay=document.getElementById('notesOverlay');
  const dl=document.getElementById('notesDownload');
  if(btn) btn.onclick=openNotes;
  if(close) close.onclick=closeNotes;
  if(overlay) overlay.onclick=closeNotes;
  if(dl) dl.onclick=downloadNotes;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeNotes(); });
})();
function bindJournal(stage){
  const store=loadJournal();
  // shared saved-indicator per day (first one found)
  const showSaved=(()=>{
    let t=null;
    return ()=>{
      stage.querySelectorAll('.journal-saved').forEach(savedEl=>{
        savedEl.textContent='Saved'; savedEl.classList.add('show');
      });
      clearTimeout(t);
      t=setTimeout(()=>stage.querySelectorAll('.journal-saved').forEach(s=>s.classList.remove('show')),1400);
    };
  })();
  stage.querySelectorAll('[data-journal]').forEach(field=>{
    const key=field.dataset.journal;
    if(store[key]) field.value=store[key];
    const isTextarea=field.tagName==='TEXTAREA';
    const big=field.classList.contains('journal')&&!field.classList.contains('grat-why');
    const autosize=()=>{ if(!isTextarea) return; field.style.height='auto'; field.style.height=Math.max(big?140:46,field.scrollHeight)+'px'; };
    autosize();
    field.addEventListener('input',()=>{
      autosize();
      const s=loadJournal(); s[key]=field.value; saveJournal(s);
      showSaved();
    });
  });
}

function bindToggles(stage){
  stage.querySelectorAll('.hd-toggle').forEach(tog=>{
    const btns=tog.querySelectorAll('button');
    btns.forEach(btn=>{
      btn.onclick=()=>{
        const v=btn.dataset.variant;
        btns.forEach(b=>b.classList.toggle('active', b===btn));
        stage.querySelectorAll('[data-variant-panel]').forEach(p=>{
          p.classList.toggle('active', p.dataset.variantPanel===v);
        });
      };
    });
  });
}

function footNav(d){
  const prevOk = d.n>0, nextOk = d.n<21;
  const prevLabel = d.n===1 ? '← Welcome' : (prevOk ? `← Day ${d.n-1}` : '←');
  const nextLabel = d.n===0 ? 'Day 1 →' : (nextOk ? `Day ${d.n+1} →` : '→');
  return `<div class="day-foot">
    <button class="nav-btn" data-prev ${prevOk?'':'disabled'}>${prevLabel}</button>
    <button class="nav-btn" data-next ${nextOk?'':'disabled'}>${nextLabel}</button>
  </div>`;
}
/* ---- purple & lavender confetti on completing a day ---- */
const CONFETTI_COLORS = ['#9d86c9','#b9a8e0','#c9b8ec','#8d76bf','#d7cdee','#7c64a8','#e8c87a'];
let _confettiPieces=[], _confettiRAF=null, _confettiCanvas=null, _confettiCtx=null;
function _confettiResize(){
  if(!_confettiCanvas) return;
  const dpr=window.devicePixelRatio||1;
  _confettiCanvas.width=window.innerWidth*dpr;
  _confettiCanvas.height=window.innerHeight*dpr;
  _confettiCtx.setTransform(dpr,0,0,dpr,0,0);
}
function fireConfetti(x,y){
  if(!_confettiCanvas){
    _confettiCanvas=document.getElementById('confetti');
    _confettiCtx=_confettiCanvas.getContext('2d');
    _confettiResize();
    window.addEventListener('resize',_confettiResize);
  }
  const cx=(x==null)?window.innerWidth/2:x;
  const cy=(y==null)?window.innerHeight/2:y;
  for(let i=0;i<90;i++){
    const ang=Math.random()*Math.PI*2;
    const speed=4+Math.random()*7;
    _confettiPieces.push({
      x:cx, y:cy,
      vx:Math.cos(ang)*speed,
      vy:Math.sin(ang)*speed-4,
      g:0.18+Math.random()*0.1,
      size:5+Math.random()*6,
      rot:Math.random()*Math.PI,
      vr:(Math.random()-0.5)*0.3,
      color:CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
      life:0, ttl:70+Math.random()*40,
      shape:Math.random()<0.5?'rect':'circ'
    });
  }
  if(!_confettiRAF) _confettiRAF=requestAnimationFrame(_confettiTick);
}
function _confettiTick(){
  _confettiCtx.clearRect(0,0,_confettiCanvas.width,_confettiCanvas.height);
  for(let i=_confettiPieces.length-1;i>=0;i--){
    const p=_confettiPieces[i];
    p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=0.99;
    const alpha=Math.max(0,1-p.life/p.ttl);
    _confettiCtx.save();
    _confettiCtx.globalAlpha=alpha;
    _confettiCtx.translate(p.x,p.y);
    _confettiCtx.rotate(p.rot);
    _confettiCtx.fillStyle=p.color;
    if(p.shape==='rect') _confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.55);
    else { _confettiCtx.beginPath(); _confettiCtx.arc(0,0,p.size/2,0,Math.PI*2); _confettiCtx.fill(); }
    _confettiCtx.restore();
    if(p.life>=p.ttl||p.y>window.innerHeight+40) _confettiPieces.splice(i,1);
  }
  if(_confettiPieces.length) _confettiRAF=requestAnimationFrame(_confettiTick);
  else { _confettiRAF=null; _confettiCtx.clearRect(0,0,_confettiCanvas.width,_confettiCanvas.height); }
}

function bindFoot(d){
  const stage=document.getElementById('stage');
  const prev=stage.querySelector('[data-prev]'), next=stage.querySelector('[data-next]'), mark=stage.querySelector('[data-mark]');
  if(prev) prev.onclick=()=>{ if(d.n>0){current=d.n-1;openPhaseFor(current);renderStage();renderPath();window.scrollTo({top:0,behavior:'smooth'});} };
  if(next) next.onclick=()=>{ if(d.n<21){current=d.n+1;openPhaseFor(current);renderStage();renderPath();window.scrollTo({top:0,behavior:'smooth'});} };
  if(mark) mark.onclick=()=>{
    const wasDone=!!progress[d.n];
    progress[d.n]=!progress[d.n];
    saveProgress(progress);
    if(!wasDone){
      const r=mark.getBoundingClientRect();
      fireConfetti(r.left+r.width/2, r.top+r.height/2);
    }
    renderStage(); renderPath();
  };
}
function openPhaseFor(n){
  PHASES.forEach((ph,pi)=>{ if(ph.days.some(d=>d.n===n)) collapsed[pi]=false; });
}

/* smart entry: newcomers land on Welcome; returning visitors resume */
(function init(){
  const started = Object.keys(progress).some(k=>progress[k]);
  if(!started){
    current = 0;
  } else {
    const firstUnfinished = flatDays.find(d=>d.tabs.length>0 && isUnlocked(d.n) && !progress[d.n]);
    current = firstUnfinished ? firstUnfinished.n : 0;
  }
  openPhaseFor(current);
  renderPath();
  renderStage();
})();
</script>
